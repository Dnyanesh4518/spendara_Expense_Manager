name: Spendara
description: "A personal finance companion app"


version: 1.0.0+3

environment:
  sdk: ^3.9.0-32.0.dev

dependencies:
  flutter:
    sdk: flutter

  #connectivity
  connectivity_plus: ^7.1.0

  #localization
  flutter_localizations:
    sdk: flutter

  #state management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  get_it: ^9.2.1

  #ads
  google_mobile_ads: ^7.0.0

  #database
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  #charts:
  fl_chart: ^1.2.0

  # evn setup
  flutter_dotenv: ^6.0.0

  #utilities
  intl: ^0.20.2
  uuid: ^4.3.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  hive_generator: ^2.0.1
  build_runner: ^2.4.9

  flutter_lints: ^5.0.0


flutter:
  generate: true


  uses-material-design: true

  assets:
    - .env
  fonts:
    - family: Inter
      fonts:
        - asset: assets/font/inter.ttf

